name: Board checks
on: [pull_request, push]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard hook tests
        run: sh tests/test_board_guard.sh
      - name: Seat files match their generator
        run: python3 scripts/gen_seats.py --check
