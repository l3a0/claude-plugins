name: kindle-highlights JavaScript checks
on: [pull_request, push]
permissions:
  contents: read
jobs:
  test:
    # The reader scripts' checks run under JavaScriptCore, which only macOS ships, so this job runs there and
    # fails rather than skipping when jsc is missing.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: kindle-highlights script tests, with jsc required
        env:
          REQUIRE_JSC: "1"
        run: python3 skills/kindle-highlights/tests/test_scripts.py
